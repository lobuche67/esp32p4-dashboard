# PAGE 2 - Home Control (Scenes)
# Good Night:    scene.good_night
# Good Morning:  scene.good_morning
# Movie Night:   scene.movie_night
# Evening Work:  scene.campfire_evening_work
# Update entity IDs below to match your HA scene names.

lvgl:
  pages:
    - id: page_home
      bg_color: 0x0D0D0D
      bg_opa: COVER
      scrollable: false
      gesture_bubble: true
      widgets:

        # Top-left: Good Night
        - obj:
            id: btn_good_night
            align: TOP_LEFT
            x: 24
            y: 76
            width: 480
            height: 228
            radius: 24
            bg_color: 0x1A1A3A
            border_opa: TRANSP
            shadow_opa: TRANSP
            clickable: true
            on_click:
              - homeassistant.action:
                  action: scene.turn_on
                  data:
                    entity_id: "scene.campfire_good_night"
            widgets:
              - label:
                  align: TOP_MID
                  y: 24
                  text: "Good Night"
                  text_font: MONTSERRAT_22
                  text_color: 0xC0C8E0
              - label:
                  align: CENTER
                  y: -10
                  text: "NIGHT"
                  text_font: MONTSERRAT_44
                  text_color: 0x7B8ECC
              - label:
                  align: BOTTOM_MID
                  y: -20
                  text: "Activate"
                  text_font: MONTSERRAT_18
                  text_color: 0x9BA2BC

        # Top-right: Good Morning
        - obj:
            id: btn_good_morning
            align: TOP_RIGHT
            x: -24
            y: 76
            width: 480
            height: 228
            radius: 24
            bg_color: 0x2A1F10
            border_opa: TRANSP
            shadow_opa: TRANSP
            clickable: true
            on_click:
              - homeassistant.action:
                  action: scene.turn_on
                  data:
                    entity_id: "scene.campfire_good_morning"
            widgets:
              - label:
                  align: TOP_MID
                  y: 24
                  text: "Good Morning"
                  text_font: MONTSERRAT_22
                  text_color: 0xC0C8E0
              - label:
                  align: CENTER
                  y: -10
                  text: "MORNING"
                  text_font: MONTSERRAT_38
                  text_color: 0xF4A900
              - label:
                  align: BOTTOM_MID
                  y: -20
                  text: "Activate"
                  text_font: MONTSERRAT_18
                  text_color: 0x9BA2BC

        # Bottom-left: Movie Night
        - obj:
            id: btn_movie_night
            align: TOP_LEFT
            x: 24
            y: 320
            width: 480
            height: 228
            radius: 24
            bg_color: 0x1A0A20
            border_opa: TRANSP
            shadow_opa: TRANSP
            clickable: true
            on_click:
              - homeassistant.action:
                  action: scene.turn_on
                  data:
                    entity_id: "scene.campfire_movie_night"
            widgets:
              - label:
                  align: TOP_MID
                  y: 24
                  text: "Movie Night"
                  text_font: MONTSERRAT_22
                  text_color: 0xC0C8E0
              - label:
                  align: CENTER
                  y: -10
                  text: "MOVIE"
                  text_font: MONTSERRAT_44
                  text_color: 0xD44CFF
              - label:
                  align: BOTTOM_MID
                  y: -20
                  text: "Activate"
                  text_font: MONTSERRAT_18
                  text_color: 0x9BA2BC

        # Bottom-right: Evening Work
        - obj:
            id: btn_evening_work
            align: TOP_RIGHT
            x: -24
            y: 320
            width: 480
            height: 228
            radius: 24
            bg_color: 0x1E1428
            border_opa: TRANSP
            shadow_opa: TRANSP
            clickable: true
            on_click:
              - homeassistant.action:
                  action: scene.turn_on
                  data:
                    entity_id: "scene.campfire_evening_work"
            widgets:
              - label:
                  align: TOP_MID
                  y: 24
                  text: "Evening Work"
                  text_font: MONTSERRAT_22
                  text_color: 0xC0C8E0
              - label:
                  align: CENTER
                  y: -10
                  text: "SCENE"
                  text_font: MONTSERRAT_44
                  text_color: 0x926BC7
              - label:
                  align: BOTTOM_MID
                  y: -20
                  text: "Activate"
                  text_font: MONTSERRAT_18
                  text_color: 0x9BA2BC
