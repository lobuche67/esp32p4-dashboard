                    entity_id: "scene.campfire_good_morning"
            widgets:
              - label:
                  align: TOP_MID
                  y: 22
                  text: "Good Morning"
                  text_font: MONTSERRAT_22
                  text_color: 0xC0C8E0
              - label:
                  align: BOTTOM_MID
                  y: -22
                  text: "Activate"
                  text_font: MONTSERRAT_14
                  text_color: 0xCC9B50

        # ── Scene buttons row 2 ───────────────────────────────────────────
        - obj:
            id: btn_movie_night
            align: TOP_LEFT
            x: 24
            y: 368
            width: 468
            height: 170
            radius: 20
            bg_color: 0x1A0A20
            border_opa: TRANSP
