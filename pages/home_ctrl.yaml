# PAGE 2 — Home Control
# Indoor sensors:
#   Living Room: sensor.ewelink_snzb_02p_temperature / sensor.ewelink_snzb_02p_humidity
#   Bedroom:     sensor.bedroom_temperature / sensor.bedroom_humidity  (update when sensor added)
# Scenes: scene.campfire_good_night / good_morning / movie_night / evening_work

sensor:

  - platform: homeassistant
    id: indoor_living_temp
    entity_id: sensor.ewelink_snzb_02p_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_living_temp
            text:
              format: "%.1f°"
              args: [x]

  - platform: homeassistant
    id: indoor_living_hum
    entity_id: sensor.ewelink_snzb_02p_humidity
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_living_hum
            text:
              format: "%.0f%%"
              args: [x]

  - platform: homeassistant
    id: indoor_bedroom_temp
    entity_id: sensor.bedroom_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_bedroom_temp
            text:
              format: "%.1f°"
              args: [x]

  - platform: homeassistant
    id: indoor_bedroom_hum
    entity_id: sensor.bedroom_humidity
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_bedroom_hum
            text:
              format: "%.0f%%"
              args: [x]

lvgl:
  pages:
    - id: page_home
      bg_color: 0x0D0D0D
      bg_opa: COVER
      scrollable: false
      gesture_bubble: true
      widgets:

        # ── Sensor row: Living Room + Bedroom ─────────────────────────────
        - obj:
            id: card_living_room
            align: TOP_LEFT
            x: 24
            y: 52
            width: 468
            height: 110
            radius: 20
            bg_color: 0x0F1E30
            border_opa: TRANSP
            shadow_opa: TRANSP
            pad_all: 0
            clickable: false
            widgets:
              - label:
                  align: TOP_LEFT
                  x: 16
                  y: 10
                  text: "Living Room"
                  text_font: MONTSERRAT_16
                  text_color: 0x9BA2BC
              - label:
                  id: lbl_living_temp
                  align: TOP_LEFT
                  x: 16
                  y: 36
                  text: "--°"
                  text_font: MONTSERRAT_34
                  text_color: 0xFFFFFF
              - label:
                  align: TOP_LEFT
                  x: 16
                  y: 82
                  text: "Temp"
                  text_font: MONTSERRAT_12
                  text_color: 0x666E88
              - label:
                  id: lbl_living_hum
                  align: TOP_RIGHT
                  x: -16
                  y: 36
                  text: "--%"
                  text_font: MONTSERRAT_34
                  text_color: 0x4C9FFF
              - label:
                  align: TOP_RIGHT
                  x: -16
                  y: 82
                  text: "RH"
                  text_font: MONTSERRAT_12
                  text_color: 0x666E88

        - obj:
            id: card_bedroom
            align: TOP_RIGHT
            x: -24
            y: 52
            width: 468
            height: 110
            radius: 20
            bg_color: 0x1A0F2A
            border_opa: TRANSP
            shadow_opa: TRANSP
            pad_all: 0
            clickable: false
            widgets:
              - label:
                  align: TOP_LEFT
                  x: 16
                  y: 10
                  text: "Bedroom"
                  text_font: MONTSERRAT_16
                  text_color: 0x9BA2BC
              - label:
                  id: lbl_bedroom_temp
                  align: TOP_LEFT
                  x: 16
                  y: 36
                  text: "--°"
                  text_font: MONTSERRAT_34
                  text_color: 0xFFFFFF
              - label:
                  align: TOP_LEFT
                  x: 16
                  y: 82
                  text: "Temp"
                  text_font: MONTSERRAT_12
                  text_color: 0x666E88
              - label:
                  id: lbl_bedroom_hum
                  align: TOP_RIGHT
                  x: -16
                  y: 36
                  text: "--%"
                  text_font: MONTSERRAT_34
                  text_color: 0x4C9FFF
              - label:
                  align: TOP_RIGHT
                  x: -16
                  y: 82
                  text: "RH"
                  text_font: MONTSERRAT_12
                  text_color: 0x666E88

        # ── Scene buttons row 1 ───────────────────────────────────────────
        - obj:
            id: btn_good_night
            align: TOP_LEFT
            x: 24
            y: 180
            width: 468
            height: 170
            radius: 20
            bg_color: 0x1A1A3A
            border_opa: TRANSP
            shadow_opa: TRANSP
            clickable: true
            on_click:
              - homeassistant.action:
                  action: scene.turn_on
                  data:
                    entity_id: "scene.campfire_good_night"
            widgets:
              - label:
                  align: TOP_MID
                  y: 22
                  text: "Good Night"
                  text_font: MONTSERRAT_22
                  text_color: 0xC0C8E0
              - label:
                  align: BOTTOM_MID
                  y: -22
                  text: "Activate"
                  text_font: MONTSERRAT_14
                  text_color: 0x7B8ECC

        - obj:
            id: btn_good_morning
            align: TOP_RIGHT
            x: -24
            y: 180
            width: 468
            height: 170
            radius: 20
            bg_color: 0x2A1F10
            border_opa: TRANSP
            shadow_opa: TRANSP
            clickable: true
            on_click:
              - homeassistant.action:
                  action: scene.turn_on
