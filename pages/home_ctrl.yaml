                    entity_id: "scene.campfire_movie_night"
            widgets:
              - label:
                  align: TOP_MID
                  y: 22
                  text: "Movie Night"
                  text_font: MONTSERRAT_22
                  text_color: 0xC0C8E0
              - label:
                  align: BOTTOM_MID
                  y: -22
                  text: "Activate"
                  text_font: MONTSERRAT_14
                  text_color: 0xA060CC

        - obj:
            id: btn_evening_work
            align: TOP_RIGHT
            x: -24
            y: 368
            width: 468
            height: 170
            radius: 20
            bg_color: 0x102010
            border_opa: TRANSP
            shadow_opa: TRANSP
            clickable: true
            on_click:
              - homeassistant.action:
