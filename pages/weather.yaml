lvgl:
  pages:
    - id: page_weather
      bg_color: 0x0D0D0D
      bg_opa: COVER
      scrollable: false
      gesture_bubble: true
      widgets:

        # Left: current conditions + holiday strip
        # height=510: internal content area = 510-32(top)-32(bottom)=446px
        # Last holiday row at y:442 + ~16px font = 458px ✓
        - obj:
            align: TOP_LEFT
            x: 24
            y: 76
            width: 460
            height: 510
            radius: 24
            bg_color: 0x1E2030
            border_opa: TRANSP
            shadow_opa: TRANSP
            pad_all: 32
            clickable: false
            widgets:

              # Icon: left-aligned, same 48px as temperature
              - label:
                  id: lbl_weather_icon
                  align: TOP_LEFT
                  x: 8
                  y: 24
                  text: "󰖐"
                  text_font: mdi_weather_large
                  text_color: 0xC0C8E0

              # Condition word: below icon, left-aligned
              - label:
                  id: lbl_weather_condition
                  align: TOP_LEFT
                  x: 8
                  y: 82
                  text: "Loading..."
                  text_font: MONTSERRAT_22
                  text_color: 0x9BA2BC

              # Temperature: right-aligned, 48px
              - label:
                  id: lbl_weather_temp
                  align: TOP_RIGHT
                  x: -8
                  y: 24
