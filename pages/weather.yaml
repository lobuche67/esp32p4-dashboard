# PAGE 0 — Weather
# Current conditions: weather.googleweather via platform: homeassistant
# Hourly forecast:    sensor.forecast_h1..h6 (add ha_google_weather_hourly_forecast.yaml to HA)
# State format:       "HH:MM,condition,temperature,precip_prob"
#
# Public holidays (platform: homeassistant text_sensor):
#   sensor.next_th_holiday  — state: "Holiday Name"  attribute days_away: N
#   sensor.next_my_holiday  — state: "Holiday Name"  attribute days_away: N
# Update entity IDs below to match your HA sensor names.

# ── Current conditions ────────────────────────────────────────────────────────
sensor:

  - platform: homeassistant
    id: weather_temp
    entity_id: weather.googleweather
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_temp
            text:
              format: "%.0f°"
              args: [x]

  - platform: homeassistant
    id: weather_feels_like
    entity_id: weather.googleweather
    attribute: apparent_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_feels
            text:
              format: "Feels %.0f°"
              args: [x]

  - platform: homeassistant
    id: weather_humidity
    entity_id: weather.googleweather
    attribute: humidity
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_hum
            text:
              format: "%.0f%%"
              args: [x]

  - platform: homeassistant
    id: weather_wind
    entity_id: weather.googleweather
    attribute: wind_speed
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_wind
            text:
              format: "%.0f km/h"
              args: [x]

  - platform: homeassistant
    id: weather_precip_prob
    entity_id: sensor.weather_precip_now
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_weather_precip
            text:
              format: "Rain %.0f%%"
              args: [x]

text_sensor:

  # -- Holiday names (sensor state) ---------------------------------------------
  - platform: homeassistant
    id: ha_next_th_holiday
    entity_id: sensor.next_holiday_thailand
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_holiday_th_name
            text: !lambda return x.c_str();

  - platform: homeassistant
    id: ha_next_my_holiday
    entity_id: sensor.next_holiday_malaysia
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_holiday_my_name
            text: !lambda return x.c_str();

  - platform: homeassistant
    id: ha_next_id_holiday
    entity_id: sensor.next_holiday_indonesia
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_holiday_id_name
            text: !lambda return x.c_str();

  # -- Holiday date attribute -> days-away labels --------------------------------
  # HA attribute "date" format: "13 Oct 2026"
  - platform: homeassistant
    id: ha_th_holiday_date
    entity_id: sensor.next_holiday_thailand
    attribute: date
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_holiday_th_days
            text: !lambda |-
              static const char* mons[] = {"Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"};
              int d=0, mo=0, y=0; char ms[4]={};
              if (sscanf(x.c_str(), "%d %3s %d", &d, ms, &y) != 3) return x.c_str();
              for (int i=0;i<12;i++) if (strcmp(ms,mons[i])==0){mo=i+1;break;}
              if (!mo) return x.c_str();
              auto now = id(sntp_time).now();
              if (!now.is_valid()) return x.c_str();
              auto rata = [](int Y,int M,int D) -> long {
                if(M<3){Y--;M+=12;}
                return 365L*Y + Y/4 - Y/100 + Y/400 + (153*M-457)/5 + D - 306;
              };
              long diff = rata(y,mo,d) - rata(now.year,now.month,now.day_of_month);
              if(diff<0) return "passed";
              if(diff==0) return "today";
              if(diff==1) return "tomorrow";
              static char buf[14];
              snprintf(buf,sizeof(buf),"in %ld days",(long)diff);
              return buf;

