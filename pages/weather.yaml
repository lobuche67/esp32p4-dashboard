  - platform: homeassistant
    id: weather_condition
    entity_id: weather.googleweather
    on_value:
      then:
        - lambda: |-
            if(x=="sunny") id(weather_icon_str)="󰆙";
            if(x=="clear-night") id(weather_icon_str)="󰖔";
            if(x=="partlycloudy") id(weather_icon_str)="󰖕";
            if(x=="cloudy") id(weather_icon_str)="󰖐";
            if(x=="fog") id(weather_icon_str)="󰖑";
            if(x=="rainy") id(weather_icon_str)="󰖗";
            if(x=="pouring") id(weather_icon_str)="󰖖";
            if(x=="lightning") id(weather_icon_str)="󰖓";
            if(x=="lightning-rainy") id(weather_icon_str)="󰙾";
            if(x=="snowy") id(weather_icon_str)="󰖘";
            if(x=="snowy-rainy") id(weather_icon_str)="󰙿";
            if(x=="windy") id(weather_icon_str)="󰖝";
            if(x=="windy-variant") id(weather_icon_str)="󰖞";
            if(x=="hail") id(weather_icon_str)="󰖒";
            if(x=="exceptional") id(weather_icon_str)="󰼰";
        - lvgl.label.update:
            id: lbl_weather_icon
            text: !lambda return id(weather_icon_str).c_str();
        - lvgl.label.update:
            id: lbl_weather_condition
            text: !lambda return x.c_str();

# ── Hourly forecast text sensors ─────────────────────────────────────────────
# HA pushes state via native API. No http_request needed.

  - platform: homeassistant
    id: ha_forecast_h1
    entity_id: sensor.forecast_h1
    on_value:
      then:
        - lambda: |-
            auto val = x;
            int c1 = val.find(',');
            if (c1 == (int)std::string::npos) return;
            int c2 = val.find(',', c1+1);
            if (c2 == (int)std::string::npos) return;
            int c3 = val.find(',', c2+1);
            if (c3 == (int)std::string::npos) c3 = (int)val.size();
            id(fc1_time) = val.substr(0, c1);
            {
              std::string cond = val.substr(c1+1, c2-c1-1);
              if(cond=="sunny") cond="󰖙";
              if(cond=="clear-night") cond="󰖔";
              if(cond=="partlycloudy") cond="󰖕";
              if(cond=="cloudy") cond="󰖐";
              if(cond=="fog") cond="󰖑";
              if(cond=="rainy") cond="󰖗";
              if(cond=="pouring") cond="󰖖";
              if(cond=="lightning") cond="󰖓";
              if(cond=="lightning-rainy") cond="󰙾";
              if(cond=="snowy") cond="󰖘";
              if(cond=="snowy-rainy") cond="󰙿";
              if(cond=="windy") cond="󰖝";
              if(cond=="windy-variant") cond="󰖞";
              if(cond=="hail") cond="󰖒";
              if(cond=="exceptional") cond="󰼰";
              id(fc1_cond) = cond;
            }
            id(fc1_temp) = val.substr(c2+1, c3-c2-1) + "°";
            id(fc1_prob) = c3 < (int)val.size() ? val.substr(c3+1) + "%" : "";
        - lvgl.label.update:
            id: lbl_fc1_day
            text: !lambda return id(fc1_time).c_str();
        - lvgl.label.update:
            id: lbl_fc1_condition
            text: !lambda return id(fc1_cond).c_str();
        - lvgl.label.update:
            id: lbl_fc1_hi
            text: !lambda return id(fc1_temp).c_str();
        - lvgl.label.update:
            id: lbl_fc1_prob
            text: !lambda return id(fc1_prob).c_str();
