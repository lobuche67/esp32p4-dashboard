# PAGE 2 - Home Control (Campfire area)
# Fan: Mi Smart Standing Fan 2  (fan.dmaker_sg_810831368_p18_s_2_fan)
# TV LED: light.tz3210_0zabbfax_ts0503b
# Floor Lamp: light.tz3210_2cvfxsfr_ts0505b
# Scene: scene.campfire_evening_work

text_sensor:

  - platform: homeassistant
    id: hs_fan
    entity_id: fan.dmaker_sg_810831368_p18_s_2_fan
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_fan_state
            text: !lambda |-
              if (x == "on") return "ON";
              return "OFF";

  - platform: homeassistant
    id: hs_bed_light
    entity_id: light.tz3210_0zabbfax_ts0503b
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_bed_light_state
            text: !lambda |-
              if (x == "on") return "ON";
              return "OFF";

  - platform: homeassistant
    id: hs_liv_light
    entity_id: light.tz3210_2cvfxsfr_ts0505b
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_liv_light_state
            text: !lambda |-
              if (x == "on") return "ON";
              return "OFF";

lvgl:
  pages:
    - id: page_home
      bg_color: 0x0D0D0D
      bg_opa: COVER
      scrollable: false
      gesture_bubble: true
      widgets:



        # ── 2x2 grid — Row 1 ─────────────────────────────────────────────

        # Top-left: Standing Fan
        - obj:
            id: btn_fan
            align: TOP_LEFT
            x: 24
            y: 76
            width: 480
            height: 228
            radius: 24
            bg_color: 0x1E2035
            border_opa: TRANSP
            shadow_opa: TRANSP
            clickable: true
            on_click:
              - homeassistant.action:
                  action: fan.toggle
                  data:
                    entity_id: "fan.dmaker_sg_810831368_p18_s_2_fan"
            widgets:
              - label:
                  align: TOP_MID
                  y: 24
                  text: "Standing Fan"
                  text_font: MONTSERRAT_22
                  text_color: 0xC0C8E0
              - label:
                  align: CENTER
                  y: -10
                  text: "FAN"
                  text_font: MONTSERRAT_48
                  text_color: 0x4C9FFF
              - label:
                  id: lbl_fan_state
                  align: BOTTOM_MID
                  y: -20
                  text: "OFF"
                  text_font: MONTSERRAT_18
                  text_color: 0x9BA2BC

        # Top-right: TV LED
        - obj:
            id: btn_bed_light
            align: TOP_RIGHT
            x: -24
            y: 76
            width: 480
            height: 228
            radius: 24
            bg_color: 0x1E2035
            border_opa: TRANSP
            shadow_opa: TRANSP
            clickable: true
            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: "light.tz3210_0zabbfax_ts0503b"
            widgets:
              - label:
                  align: TOP_MID
                  y: 24
                  text: "TV LED"
                  text_font: MONTSERRAT_22
                  text_color: 0xC0C8E0
              - label:
                  align: CENTER
                  y: -10
                  text: "LIGHT"
                  text_font: MONTSERRAT_48
                  text_color: 0xF4A900
              - label:
                  id: lbl_bed_light_state
                  align: BOTTOM_MID
                  y: -20
                  text: "OFF"
                  text_font: MONTSERRAT_18
                  text_color: 0x9BA2BC

        # ── 2x2 grid — Row 2 ─────────────────────────────────────────────

        # Bottom-left: Floor Lamp
        - obj:
            id: btn_liv_light
            align: TOP_LEFT
            x: 24
            y: 320
            width: 480
            height: 228
            radius: 24
            bg_color: 0x1E2035
            border_opa: TRANSP
            shadow_opa: TRANSP
            clickable: true
            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: "light.tz3210_2cvfxsfr_ts0505b"
            widgets:
              - label:
                  align: TOP_MID
                  y: 24
                  text: "Floor Lamp"
                  text_font: MONTSERRAT_22
                  text_color: 0xC0C8E0
              - label:
                  align: CENTER
                  y: -10
                  text: "LIGHT"
                  text_font: MONTSERRAT_48
                  text_color: 0xF4A900
              - label:
                  id: lbl_liv_light_state
                  align: BOTTOM_MID
                  y: -20
                  text: "OFF"
                  text_font: MONTSERRAT_18
                  text_color: 0x9BA2BC

        # Bottom-right: Evening Work Scene
        - obj:
            id: btn_sleep
            align: TOP_RIGHT
            x: -24
            y: 320
            width: 480
            height: 228
            radius: 24
            bg_color: 0x1E2035
            border_opa: TRANSP
            shadow_opa: TRANSP
            clickable: true
            on_click:
              - homeassistant.action:
                  action: scene.turn_on
                  data:
                    entity_id: "scene.campfire_evening_work"
            widgets:
              - label:
                  align: TOP_MID
                  y: 24
                  text: "Evening Work"
                  text_font: MONTSERRAT_22
                  text_color: 0xC0C8E0
              - label:
                  align: CENTER
                  y: -10
                  text: "SCENE"
                  text_font: MONTSERRAT_44
                  text_color: 0x926BC7
              - label:
                  align: BOTTOM_MID
                  y: -20
                  text: "Activate"
                  text_font: MONTSERRAT_18
                  text_color: 0x9BA2BC
